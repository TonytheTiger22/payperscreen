<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent payment control</title>
<style>
 :root{--ink:#16191d;--dim:#5f6a75;--line:#e0e4e9;--go:#1a7f4b;--stop:#b3261e;--amber:#a4600a}
 *{box-sizing:border-box}
 body{margin:0;background:#f5f7f9;color:var(--ink);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
      display:flex;justify-content:center;padding:32px 18px 90px}
 main{width:100%;max-width:760px}
 h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
 .sub{color:var(--dim);margin:0 0 24px;font-size:15px}
 .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:14px}
 .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:9px}
 button{font:inherit;font-weight:640;border:0;border-radius:9px;padding:12px 20px;cursor:pointer}
 .p{background:#1a2634;color:#fff}.p:disabled{opacity:.4;cursor:default}
 .g{background:#fff;border:2px solid var(--line);color:var(--dim);padding:10px 16px}
 .clear{background:var(--go);color:#fff}.esc{background:var(--stop);color:#fff}
 .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
 .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
 .kv span:first-child{color:var(--dim)}
 table{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px}
 th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
 td{padding:9px 8px;border-bottom:1px solid #eef1f4}
 tr.no td{background:#fff6f5}
 .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
 .tag.y{background:#e6f4ec;color:var(--go)}.tag.n{background:#fdeceb;color:var(--stop)}
 .banner{border-radius:11px;padding:15px 17px;font-size:16px;font-weight:600;margin-bottom:14px}
 .banner.ok{background:#e6f4ec;color:#12603a}
 .banner.warn{background:#fdf3e3;color:var(--amber)}
 .banner.stop{background:#fdeceb;color:var(--stop)}
 .note{font-size:13px;color:var(--dim);margin-top:10px;font-weight:400}
 .narr{font-size:15px;line-height:1.6;margin:0}
 .chk{font-size:14px;padding:4px 0;color:var(--dim)}
 .chk b{color:var(--ink);font-weight:600}
 .cost{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;
       border-bottom:1px solid #eef1f4;color:var(--dim)}
 .cost:last-child{border:0}
 a{color:#1858c4}
 .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
</style></head><body><main>
<h1>Agent payment control</h1>
<p class="sub">An agent is releasing a vendor payment. It must screen the counterparty first.</p>

<div class="card">
 <div class="lbl">Choose a counterparty</div>
 <div class="row">
  <button class="p" id="b-clean">Release INV-88213 &mdash; M. Santos Oliveira</button>
  <button class="p" id="b-hit">Release INV-88214 &mdash; V. Petrov</button>
  <button class="g" id="b-reset">Reset</button>
  <a href="/audit"><button class="g">Audit trail</button></a>
 </div>
</div>

<div id="stage"></div>

<div class="card">
 <div class="lbl">What the agent spent</div>
 <div id="ledger" class="note">Nothing yet.</div>
</div>
</main>
<script>
const $=(i)=>document.getElementById(i);
const c=(n)=>(n*100).toFixed(n*100<1?1:0)+"\u00A2";
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},
                           body:JSON.stringify(b||{})}).then(r=>r.json());
let cur=null;

function ledger(l){
 $("ledger").innerHTML = l.lines.length
  ? l.lines.map(x=>'<div class="cost"><span>'+x.label+'</span><span>'+c(x.price)
      +' \u00B7 '+x.ms+' ms'+(x.tx?' \u00B7 <a target="_blank" href="https://sepolia.basescan.org/tx/'
      +x.tx+'">tx</a>':'')+'</span></div>').join('')
    +'<div class="cost" style="color:#16191d;font-weight:700"><span>Total</span><span>'
      +c(l.spent)+'</span></div>'
  : "Nothing yet.";
}

function paymentCard(p){
 return '<div class="card"><div class="lbl">Payment pending release</div>'
 +'<div class="kv"><span>Reference</span><b>'+p.ref+'</b></div>'
 +'<div class="kv"><span>Counterparty</span><b>'+p.vendor+'</b></div>'
 +'<div class="kv"><span>Amount</span><b>'+p.amount+'</b></div>'
 +'<div class="kv"><span>Purpose</span><b>'+p.purpose+'</b></div></div>';
}

function screenCard(s){
 return '<div class="card"><div class="lbl">Screening result &mdash; purchased 2\u00A2</div>'
 +'<div class="kv"><span>Lists checked</span><b>'+s.listsChecked.join(", ")+'</b></div>'
 +'<div class="kv"><span>Matches</span><b>'+s.hitCount+'</b></div>'
 +(s.hitCount?'<div class="kv"><span>Top match</span><b>'+s.hits[0].name+' \u2014 '
   +s.hits[0].list+' \u2014 score '+s.hits[0].score+'</b></div>':'')+'</div>';
}

function contextCard(x){
 const rows=x.fields.map(f=>'<tr class="'+(f.agree?'':'no')+'"><td>'+f.field+'</td><td>'
   +f.subject+'</td><td>'+f.listed+'</td><td><span class="tag '+(f.agree?'y':'n')+'">'
   +(f.agree?'agrees':'differs')+'</span></td></tr>').join('');
 const checks=x.completeness.map(k=>'<div class="chk">'+(k.ok?'\u2713':'\u2717')
   +' <b>'+k.check+'</b>'+(k.ok?'':' \u2014 not available')+'</div>').join('');
 return '<div class="card"><div class="lbl">Field comparison &mdash; purchased 5\u00A2</div>'
 +'<table><tr><th>Field</th><th>Your subject</th><th>Listed party</th><th></th></tr>'+rows+'</table>'
 +'<div class="note">'+x.meta.list+' '+x.meta.listVersion+' \u00B7 '+x.meta.program
 +' \u00B7 '+x.meta.uid+' \u00B7 matched on: '+x.meta.matchedOn+'</div></div>'
 +'<div class="card"><div class="lbl">Narrative summary</div><p class="narr">'+x.narrative+'</p>'
 +'<div class="note">This summary states no conclusion and makes no recommendation. '
 +'Disposition is reserved to the reviewer.</div></div>'
 +'<div class="card"><div class="lbl">Completeness check</div>'+checks+'</div>';
}

function decisionCard(){
 return '<div class="card"><div class="lbl">Human decision required</div>'
 +'<div class="row"><button class="clear" id="d-clear">Clear &mdash; release payment</button>'
 +'<button class="esc" id="d-esc">Escalate &mdash; block payment</button></div>'
 +'<div class="note">The agent cannot dispose of this alert. It has stopped and is waiting.<br>'
 +'Check reference <code>'+cur.record.reference+'</code> \u2014 recorded, open.</div></div>';
}

async function run(id){
 $("stage").innerHTML='<div class="card">Screening\u2026 paying as it goes.</div>';
 const r=await post("/api/run",{id});
 if(!r.ok){$("stage").innerHTML='<div class="card">'+r.error+'</div>';return;}
 cur=r; ledger(r.ledger);

 if(r.outcome==="clear"){
  $("stage").innerHTML='<div class="banner ok">No matches. Payment released automatically.</div>'
   +paymentCard(r.payment)+screenCard(r.screen)
   +'<div class="card"><div class="lbl">Outcome</div><div class="big">'+r.payment.amount
   +' released</div><div class="note">Total compliance cost: 2\u00A2. No human touched this.<br>'
   +'Recorded as <code>'+r.record.reference+'</code>.</div></div>';
  return;
 }

 $("stage").innerHTML='<div class="banner warn">Possible match. Agent halted and bought context.</div>'
  +paymentCard(r.payment)+screenCard(r.screen)+contextCard(r.context)+decisionCard();
 $("d-clear").onclick=()=>decide(true);
 $("d-esc").onclick=()=>decide(false);
}

async function decide(cleared){
 const p=cur.payment;
 const d=await post("/api/dispose",{reference:cur.record.reference,
                    disposition:cleared?"cleared":"escalated"});
 $("stage").innerHTML=(cleared
  ?'<div class="banner ok">Cleared by reviewer. Payment released.</div>'
  :'<div class="banner stop">Escalated. Payment blocked \u2014 not settled.</div>')
  +paymentCard(p)+contextCard(cur.context)
  +'<div class="card"><div class="lbl">Outcome</div><div class="big">'
  +(cleared?p.amount+' released':p.amount+' held')+'</div>'
  +'<div class="note">Decision by human reviewer, recorded against '+p.ref
  +' as check <code>'+cur.record.reference+'</code> at '
  +(d.record?new Date(d.record.disposed_at).toLocaleTimeString():'now')
  +'. Compliance cost 7\u00A2 \u2014 the agent assembled the file, the reviewer judged it.</div>'
  +'<div class="row" style="margin-top:12px"><a href="/audit"><button class="g">'
  +'View audit trail &rarr;</button></a></div></div>';
}

$("b-clean").onclick=()=>run("clean");
$("b-hit").onclick=()=>run("hit");
$("b-reset").onclick=async()=>{ledger(await post("/api/reset"));$("stage").innerHTML="";};
fetch("/api/ledger").then(r=>r.json()).then(ledger);
</script></body></html>
